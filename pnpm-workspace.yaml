packages:
  - "apps/*"
  - "packages/*"

# Единая версия для зависимостей, которые используются больше чем одним пакетом.
# Пакеты ссылаются на них как "catalog:" — разъехаться версиям уже нельзя.
# zod прибит точной версией: 4.6.2 не проходит карантин minimumReleaseAge.
catalog:
  "@types/node": ^24.13.4
  rimraf: ^6.0.1
  typescript: ^6.0.3
  zod: 4.6.1

# zod приходит ещё и транзитивно (его тянет Next), а туда каталог не достаёт.
# Override держит одну версию во всём дереве — заодно гарантирует, что схемы
# из @asf/contracts и схемы в приложениях создаёт один и тот же экземпляр zod.
overrides:
  zod: 4.6.1

# pnpm не выполняет postinstall-скрипты зависимостей, пока их явно не разрешишь.
# Этим разрешено: нужно распаковать нативный бинарник под платформу.
allowBuilds:
  esbuild: true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true
  unrs-resolver: true
