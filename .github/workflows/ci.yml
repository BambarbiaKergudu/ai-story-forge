name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install:
    name: Install dependencies
    # Не ubuntu-latest: с 19 октября 2026 он станет Ubuntu 26.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm lint

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm typecheck

  build:
    name: Build
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      # Сборка страниц импортирует auth.ts. Секретов репозитория нет:
      # это публичные заглушки из .env.example, ими сессии на проде не подписывают.
      - run: pnpm build
        env:
          AUTH_SECRET: dev-only-auth-secret-change-me-please
          SERVICE_JWT_SECRET: dev-only-service-jwt-secret-change-me
