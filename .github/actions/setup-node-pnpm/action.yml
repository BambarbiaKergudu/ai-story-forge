name: Setup Node and pnpm
description: Node from .nvmrc, pnpm from packageManager, frozen install

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install
      run: pnpm install --frozen-lockfile
      shell: bash
